<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>溯知 · 对话</title>
    <link rel="stylesheet" href="../shared/css/fonts.css" />
    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/shell.css" />
    <link rel="stylesheet" href="./css/workbench.css" />
    <link rel="stylesheet" href="/shared/lib/katex/katex.min.css" />
    <script defer src="/shared/lib/katex/katex.min.js"></script>
    <script defer src="/shared/lib/katex/auto-render.min.js"></script>
  </head>
  <body>
    <div data-sz-shell></div>
    <main class="sz-workbench" id="sz-workbench">
      <section class="sz-panel sz-history" id="sz-history-panel">
        <div class="sz-history-toolbar">
          <button type="button" id="sz-new-chat" class="sz-new-chat">新对话</button>
          <button
            type="button"
            id="sz-history-toggle"
            class="sz-history-toggle"
            aria-expanded="true"
            aria-controls="sz-history-panel"
            title="收起侧栏"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M9 4v16" fill="none" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </button>
        </div>
        <div class="sz-history-list" id="sz-history-list"></div>
      </section>
      <div
        class="sz-splitter"
        data-sz-splitter
        role="separator"
        aria-orientation="vertical"
        aria-label="调整历史栏宽度"
        tabindex="0"
      ></div>
      <section class="sz-panel sz-ask" id="sz-ask-panel">
        <button
          type="button"
          id="sz-history-expand"
          class="sz-history-expand"
          hidden
          title="展开侧栏"
          aria-label="展开侧栏"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M9 4v16" fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
        </button>
        <div class="sz-ask-stream" id="sz-ask-stream"></div>
        <form class="sz-ask-composer" id="sz-ask-form">
          <select id="sz-ask-mode" aria-label="问答模式">
            <option value="auto">自动识别</option>
            <option value="qa">自由问答</option>
            <option value="concept">知识点</option>
            <option value="chapter">章节概览</option>
          </select>
          <textarea id="sz-ask-input" rows="2" placeholder="输入问题…"></textarea>
          <button type="submit" id="sz-ask-submit">提问</button>
        </form>
      </section>
    </main>
    <script type="module" src="./js/workbench.js"></script>
  </body>
</html>
