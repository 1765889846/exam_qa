<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>溯知 · 我的题库</title>
    <link rel="stylesheet" href="../shared/css/fonts.css" />
    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/shell.css" />
    <link rel="stylesheet" href="./css/bank.css" />
  </head>
  <body>
    <div data-sz-shell></div>
    <main class="bank-page">
      <header class="bank-hero">
        <p class="bank-eyebrow">MY QUESTION BANK</p>
        <h1>我的题库</h1>
        <p>先从当前课程的有效资料取证，再生成可编辑的题目草稿；勾选题目即可保存一份试卷。</p>
      </header>
      <section class="bank-grid">
        <form class="bank-card bank-form" id="bank-generate-form">
          <h2>按资料出题</h2>
          <label>知识点或主题<input id="bank-topic" required maxlength="300" placeholder="如：采样定理" /></label>
          <label>章节（可选）<input id="bank-chapter" maxlength="160" placeholder="如：第 4 章" /></label>
          <div class="bank-row">
            <label>题型<select id="bank-type"><option value="short_answer">简答题</option><option value="choice">选择题</option><option value="fill_blank">填空题</option></select></label>
            <label>难度<select id="bank-difficulty"><option value="easy">基础</option><option value="medium" selected>中等</option><option value="hard">困难</option></select></label>
            <label>题数<input id="bank-count" type="number" min="1" max="10" value="3" /></label>
          </div>
          <button class="bank-primary" type="submit" id="bank-generate">生成并存入题库</button>
          <p class="bank-hint">没有检索到足够资料时不会生成或保存题目。</p>
        </form>
        <form class="bank-card bank-form" id="bank-paper-form">
          <h2>保存试卷</h2>
          <label>试卷名称<input id="bank-paper-title" required maxlength="200" placeholder="如：采样定理练习卷" /></label>
          <label>说明（可选）<textarea id="bank-paper-description" maxlength="1000" rows="3" placeholder="适用范围、考试时长等"></textarea></label>
          <button class="bank-secondary" type="submit">用已勾选题目保存试卷</button>
          <p class="bank-hint" id="bank-selection">尚未勾选题目</p>
        </form>
      </section>
      <form class="bank-card bank-form bank-plan" id="bank-assemble-form">
        <div>
          <p class="bank-eyebrow">CONTROLLED ASSEMBLY</p>
          <h2>按蓝图自动组卷</h2>
          <p class="bank-hint">优先复用当前题库中带有效资料依据的题目；不足时才按主题补生成草稿，并在题数、题型、难度、章节和总分通过校验后保存。</p>
        </div>
        <label>试卷名称<input id="bank-assemble-title" required maxlength="200" placeholder="如：第 4 章单元测验" /></label>
        <label>出题主题<input id="bank-assemble-topic" required maxlength="300" placeholder="如：采样定理" /></label>
        <div class="bank-row bank-plan-row">
          <label>章节<input id="bank-assemble-chapter" maxlength="160" placeholder="可选" /></label>
          <label>题型<select id="bank-assemble-type"><option value="short_answer">简答题</option><option value="choice">选择题</option><option value="fill_blank">填空题</option></select></label>
          <label>难度<select id="bank-assemble-difficulty"><option value="easy">基础</option><option value="medium" selected>中等</option><option value="hard">困难</option></select></label>
          <label>题数<input id="bank-assemble-count" type="number" min="1" max="50" value="5" /></label>
          <label>每题分<input id="bank-assemble-score" type="number" min="0.5" max="100" step="0.5" value="2" /></label>
        </div>
        <label class="bank-check"><input id="bank-assemble-generate" type="checkbox" checked /> 题库不足时，允许依据资料补题</label>
        <button class="bank-primary" type="submit" id="bank-assemble">按蓝图保存试卷</button>
      </form>
      <section class="bank-section">
        <div class="bank-section-head"><h2>题目草稿</h2><p id="bank-question-count">读取中…</p></div>
        <div class="bank-list" id="bank-questions"></div>
      </section>
      <section class="bank-section">
        <div class="bank-section-head"><h2>已保存试卷</h2><p id="bank-paper-count"></p></div>
        <div class="bank-list" id="bank-papers"></div>
      </section>
    </main>
    <script type="module" src="./js/bank.js"></script>
  </body>
</html>
